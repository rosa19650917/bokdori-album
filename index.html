];let index=0;const photo=document.getElementById('photo'),count=document.getElementById('count'),caption=document.getElementById('caption');function show(i){index=(i+photos.length)%photos.length;photo.classList.add('fade');setTimeout(()=>{photo.src=photos[index].src;photo.alt=photos[index].title;count.textContent=String(index+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0');caption.textContent=photos[index].title;photo.classList.remove('fade')},130)}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});let startX=0,startY=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)show(index+(dx<0?1:-1))},{passive:true});show(0);
